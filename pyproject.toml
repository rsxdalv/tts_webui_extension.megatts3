[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts_webui_extension.megatts3"
version = "0.1.0"
description = "A template extension for TTS Generation WebUI"
readme = "README.md"
authors = [
    {name = "Your Name"}
]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "tts-webui.megatts3>=0.1.1",
    "tts_webui_extension.openai_tts_api>=1.3.4",
    "openai-whisper",
    "pynini @ https://github.com/rsxdalv/pynini-builder/releases/download/2.1.6/pynini-2.1.6-cp310-cp310-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.10'",
    "pynini @ https://github.com/rsxdalv/pynini-builder/releases/download/2.1.6/pynini-2.1.6-cp311-cp311-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.11'",
    "pynini @ https://github.com/rsxdalv/pynini-builder/releases/download/2.1.6/pynini-2.1.6-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.12'",
]

[project.urls]
Homepage = "https://github.com/rsxdalv/tts_webui_extension.megatts3"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# This will find all namespace packages automatically
namespaces = true
